<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9e7e1">
<title>论文精读报告</title>
<style>
  /* ═══════════════ 设计变量 ═══════════════
     米白纸面 + 深墨正文 + 学术蓝强调，偏向论文的阅读感。
     ═══════════════════════════════════════ */
  :root{
    --paper:      #fbfaf7;
    --paper-deep: #e9e7e1;
    --card:       #ffffff;
    --ink:        #22222a;
    --muted:      #62626d;
    --line:       #dedbd3;
    --accent:     #1f55d5;
    --accent-2:   #c2521e;
    --radius:     10px;
    --font-zh:  "PingFang SC","Hiragino Sans GB","Microsoft YaHei",
                "Noto Sans CJK SC","Source Han Sans SC",sans-serif;
    --font-mono:"SF Mono","Menlo","Consolas","Courier New",monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--paper-deep);
    color:var(--ink);
    font-family:var(--font-zh);
    -webkit-font-smoothing:antialiased;
  }

  .home{max-width:1080px;margin:0 auto;padding:88px 32px 96px;}

  .home-kicker{
    color:var(--accent);letter-spacing:.35em;
    font-size:13px;font-weight:600;margin-bottom:18px;
  }
  .home h1{font-size:46px;font-weight:800;color:var(--ink);
    margin:0 0 12px;letter-spacing:.01em;}
  .home .sub{color:var(--muted);font-size:16px;margin-bottom:56px;line-height:1.9;}
  .home .sub kbd{
    font-family:var(--font-mono);font-size:12px;background:var(--card);
    border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--ink);
  }

  /* ── 卡片网格：自动按容器宽度决定列数，最窄 290px ── */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px;}

  .card{
    display:block;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  .card:hover{
    transform:translateY(-4px);border-color:var(--accent);
    box-shadow:0 10px 28px rgba(34,34,42,.10);
  }
  .card .thumb{
    height:180px;display:flex;align-items:center;justify-content:center;
    background:var(--paper);border-bottom:1px solid var(--line);
  }
  .card .thumb img{max-width:90%;max-height:158px;object-fit:contain;}

  .card .meta{padding:20px 24px 24px;}
  .card .no{
    font-family:var(--font-mono);font-size:12px;
    color:var(--accent);letter-spacing:.2em;
  }
  .card .name{font-size:20px;font-weight:700;margin:10px 0 8px;line-height:1.35;}
  .card .cnt{font-size:13px;color:var(--muted);line-height:1.6;}

  /* ── 页脚 ── */
  .foot{
    max-width:1080px;margin:0 auto;padding:0 32px 72px;
    font-size:12px;color:var(--muted);
    font-family:var(--font-mono);letter-spacing:.05em;
  }

  /* ── 窄屏 ── */
  @media (max-width:720px){
    .home{padding:56px 20px 64px;}
    .home h1{font-size:32px;}
    .home .sub{font-size:14px;margin-bottom:36px;}
    .cards{gap:18px;}
    .foot{padding:0 20px 48px;}
  }
</style>
</head>
<body>

<div class="home">
  <div class="home-kicker">PAPER READING</div>
  <h1>论文精读报告</h1>
  <div class="sub">
    两份论文的中文汇报，网页版幻灯片。键盘 <kbd>←</kbd><kbd>→</kbd> 翻页 ·
    <kbd>O</kbd> 总览 · <kbd>N</kbd> 讲稿 · <kbd>F</kbd> 全屏
  </div>

  <div class="cards">
    <a class="card" href="gcg/">
      <div class="thumb"><img src="gcg/assets/fig1.png" alt=""></div>
      <div class="meta">
        <div class="no">PAPER 01</div>
        <div class="name">GCG：通用且可迁移的对抗后缀攻击</div>
        <div class="cnt">23 页 · 攻击方法 / 迁移性 / 消融与讨论<br>Zou et al., 2023 · arXiv:2307.15043</div>
      </div>
    </a>

    <a class="card" href="androidworld/">
      <div class="thumb"><img src="androidworld/assets/fig1-overview.png" alt=""></div>
      <div class="meta">
        <div class="no">PAPER 02</div>
        <div class="name">AndroidWorld：面向自主智能体的动态评测环境</div>
        <div class="cnt">18 页 · 背景与问题 / 环境机制 / 实验结果<br>Google DeepMind · ICLR 2025</div>
      </div>
    </a>
  </div>
</div>

<div class="foot">zzyexplorarionofcode.github.io</div>

</body>
</html>
